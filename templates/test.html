{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow-sm">
        <h3 class="text-primary mb-4">📝 Шалгалт ажиллуулах хэсэг</h3>
        <div class="alert alert-secondary">
            <strong>Анги:</strong> {{ angi }}-р анги | <strong>Хичээл:</strong> {{ hicheel }}
        </div>
        
        <hr>
        
        <div id="quiz-container">
            <div class="text-center p-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Асуултуудыг ачаалж байна, түр хүлээнэ үү...</p>
            </div>
        </div>
        
        <div class="text-end mt-4">
            <button onclick="submitQuiz()" class="btn btn-success btn-lg px-5">Тестийг дуусгах</button>
        </div>
    </div>
</div>

<script>
let userAnswers = [];

function loadQuestions() {
    fetch('/api/get-questions?angi={{ angi }}&hicheel={{ hicheel }}')
    .then(res => res.json())
    .then(data => {
        if (!data.questions || data.questions.length === 0) {
            document.getElementById('quiz-container').innerHTML = '<div class="alert alert-warning">Энэ хичээлээр одоогоор асуулт бүртгэгдээгүй байна.</div>';
            return;
        }
        
        let html = '';
        data.questions.forEach((q, index) => {
            html += `
            <div class="card mb-4 p-3 border-start border-primary border-3 shadow-sm">
                <h5 class="fw-bold">${index + 1}. ${q.asuult}</h5>
                <span class="badge bg-light text-dark mb-3 align-self-start">Сэдэв: ${q.sedew}</span>
                <div class="mt-2">`;
            
            // Санамсаргүй холигдсон хариултуудыг зурах
            q.choices.forEach((choice, cIndex) => {
                html += `
                <div class="form-check my-2 p-2 rounded bg-light-hover" style="padding-left: 2.5rem;">
                    <input class="form-check-input" type="radio" name="q_${q.id}" id="q_${q.id}_${cIndex}" value="${choice.text}" onchange="saveAnswer(${q.id}, '${choice.text.replace(/'/g, "\\'")}')">
                    <label class="form-check-label w-100" for="q_${q.id}_${cIndex}">
                        ${choice.text}
                    </label>
                </div>`;
            });
            
            html += `</div></div>`;
        });
        document.getElementById('quiz-container').innerHTML = html;
    })
    .catch(err => {
        document.getElementById('quiz-container').innerHTML = '<div class="alert alert-danger">Асуултуудыг татахад алдаа гарлаа.</div>';
    });
}

function saveAnswer(qId, text) {
    let existing = userAnswers.find(a => a.question_id === qId);
    if(existing) {
        existing.selected_text = text;
    } else {
        userAnswers.push({ question_id: qId, selected_text: text });
    }
}

function submitQuiz() {
    if(userAnswers.length === 0) {
        if(!confirm("Та нэг ч асуултанд хариулаагүй байна. Шалгалтыг шууд дуусгах уу?")) return;
    }

    // Илгээж байх үед товчийг идэвхгүй болгох
    document.getElementById('quiz-container').innerHTML = '<div class="text-center p-5"><h5>Үр дүнг тооцож, Gemini AI асуултуудыг бэлдэж байна...</h5></div>';

    fetch('/api/submit-test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers: userAnswers })
    })
    .then(res => res.json())
    .then(result => {
        if(result.status === 'success') {
            sessionStorage.setItem('test_result', JSON.stringify(result));
            window.location.href = '/result';
        }
    })
    .catch(err => {
        alert("Хариуг илгээхэд алдаа гарлаа. Дахин оролдоно уу.");
        loadQuestions();
    });
}

window.onload = loadQuestions;
</script>

<style>
.bg-light-hover:hover {
    background-color: #f0f2f5;
    cursor: pointer;
}
</style>
{% endblock %}
