<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPER BRAIN - Цогц Систем</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#ffffff; --bg2:#f8fafc; --surface:#ffffff; --border:#e2e8f0;
      --text:#0f172a; --text2:#64748b; --text3:#94a3b8;
      --blue1:#E6F1FB; --blue2:#378ADD; --blue3:#0C447C;
      --green1:#E1F5EE; --green2:#1D9E75; --green3:#085041;
      --purple1:#EEEDFE; --purple2:#7F77DD; --purple3:#3C3489;
      --shadow:rgba(0,0,0,0.06);
    }
    body {
      background: var(--bg);
      /* Bubble эффект: Хуудасны дэвсгэр дээр олон хөөсөнцөр эффект нэмэв */
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(55, 138, 221, 0.1), transparent 20%),
        radial-gradient(circle at 90% 20%, rgba(127, 119, 221, 0.1), transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(29, 158, 117, 0.08), transparent 20%),
        radial-gradient(circle at 80% 90%, rgba(55, 138, 221, 0.08), transparent 15%),
        radial-gradient(circle at 20% 90%, rgba(127, 119, 221, 0.08), transparent 15%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding-top: 76px;
    }

    /* Таны өмнөх бүх CSS класс энд байна */
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); position: fixed; top: 0; width: 100%; z-index: 150; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .logo-a { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-box { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg,#378ADD,#7F77DD); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .nbtn { padding: 8px 16px; border-radius: 10px; background: linear-gradient(135deg,#378ADD,#7F77DD); color: #fff; text-decoration: none; font-weight: 600; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .hero { padding: 2.5rem 0; text-align: center; }
    .hh { font-size: 3rem; font-weight: 800; margin-bottom: 1.5rem; color: var(--text); }
    .hh .gr { background: linear-gradient(135deg,var(--blue2),var(--purple2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .ai-search-wrap { max-width: 760px; margin: 0 auto 2.5rem; }
    .ai-search-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 8px 36px var(--shadow); }
    .ai-input-row { display: flex; align-items: center; gap: 10px; }
    .ai-input { flex: 1; border: none; background: transparent; padding: 8px; outline: none; }
    .ai-send { width: 40px; height: 40px; border-radius: 10px; background: var(--blue2); border: none; color: #fff; cursor: pointer; }
    
    .grade-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 840px; margin: 0 auto; }
    .gc { border-radius: 20px; padding: 2.5rem; border: 1px solid var(--border); background: var(--surface); transition: 0.3s; cursor: pointer; }
    .gc:hover { transform: translateY(-8px); }
  </style>
</head>
<body>

<nav class="nav">
  <a class="logo-a" href="/">
    <div class="logo-box">SB</div>
    <div><span class="logo-name">Super Brain</span></div>
  </a>
  <div class="nr">
    {% if current_user.is_authenticated %}
      <span style="margin-right:15px; font-weight:600;">{{ current_user.ner }}</span>
      <a href="{{ url_for('logout') }}" class="nbtn">Гарах</a>
    {% else %}
      <a href="{{ url_for('login') }}" class="nbtn">Нэвтрэх</a>
    {% endif %}
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1 class="hh">Мэдлэгээ <span class="gr">Шалгаж</span>,<br>Ирээдүйгээ Цогцлон Бүтээ</h1>

    <div class="ai-search-wrap">
      <div class="ai-search-box">
        <form action="/" method="POST" class="ai-input-row">
          <input class="ai-input" name="prompt" placeholder="Хичээл эсвэл сэдэв хайх..." required />
          <button type="submit" class="ai-send">↑</button>
        </form>
      </div>
    </div>

    <div class="grade-row">
      <div class="gc g5"><span class="gn" style="color:var(--blue2)">5</span><span class="gl">Дугаар анги</span></div>
      <div class="gc g9"><span class="gn" style="color:var(--green2)">9</span><span class="gl">Дугаар анги</span></div>
      <div class="gc g12"><span class="gn" style="color:var(--purple2)">12</span><span class="gl">Дугаар анги</span></div>
    </div>
  </div>
</div>

</body>
</html>
