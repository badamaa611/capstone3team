<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPER BRAIN - Цогц Систем</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    /* Үндсэн тохиргоо */
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    
    body{
      background: #ffffff;
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:16px;
      line-height:1.7;
      color:#0f172a;
      padding-top:76px;
      /* Bubble эффект: style блокийн дотор зөв байршууллаа */
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(55, 138, 221, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(127, 119, 221, 0.15), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(29, 158, 117, 0.1), transparent 20%),
        radial-gradient(circle at 10% 10%, rgba(55, 138, 221, 0.08), transparent 15%),
        radial-gradient(circle at 90% 90%, rgba(127, 119, 221, 0.08), transparent 15%);
      background-attachment: fixed;
    }
    
    :root{
      --bg:#ffffff;--bg2:#f8fafc;--surface:#ffffff;--border:#e2e8f0;
      --text:#0f172a;--text2:#64748b;--text3:#94a3b8;
      --blue1:#E6F1FB;--blue2:#378ADD;--blue3:#0C447C;
      --green1:#E1F5EE;--green2:#1D9E75;--green3:#085041;
      --purple1:#EEEDFE;--purple2:#7F77DD;--purple3:#3C3489;
      --shadow:rgba(0,0,0,0.06);
    }

    /* Навигацийн хэсэг */
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;border-bottom:1px solid rgba(15,23,42,0.08);background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);position:fixed;top:0;width:100%;z-index:150;box-shadow:0 10px 30px rgba(15,23,42,0.06)}
    .logo-a{display:flex;align-items:center;gap:10px;text-decoration:none}
    .logo-box{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#378ADD,#7F77DD);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
    .logo-name{font-size:18px;font-weight:800;color:var(--text)}
    .logo-tag{font-size:11px;color:var(--text3)}
    
    /* Бусад элементүүд */
    .nbtn{padding:8px 16px;border-radius:10px;background:linear-gradient(135deg,#378ADD,#7F77DD);color:#fff;text-decoration:none;font-weight:600;font-size:13px}
    .container{max-width:1200px;margin:0 auto;padding:0 24px}
    .hero{padding:2.5rem 0;text-align:center}
    .hh{font-size:3rem;font-weight:800;margin-bottom:1.5rem}
    .hh .gr{background:linear-gradient(135deg,var(--blue2),var(--purple2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    
    .ai-search-box{background:white;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 8px 36px rgba(0,0,0,0.05);max-width:760px;margin:0 auto 2.5rem}
    .ai-input-row{display:flex;gap:10px;align-items:center}
    .ai-input{flex:1;border:none;outline:none;padding:5px}
    .ai-send{padding:10px 20px;border-radius:10px;background:var(--blue2);color:white;border:none;cursor:pointer}
    
    .grade-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:840px;margin:0 auto}
    .gc{border-radius:20px;padding:2.5rem;border:1px solid var(--border);background:white;transition:0.3s}
    .gc:hover{transform:translateY(-8px);box-shadow:0 10px 20px rgba(0,0,0,0.1)}
  </style>
</head>
<body>

<nav class="nav">
  <a class="logo-a" href="/">
    <div class="logo-box">SB</div>
    <div>
      <span class="logo-name">Super Brain</span>
      <span class="logo-tag">Цогц Систем</span>
    </div>
  </a>
  <div class="nr">
    {% if current_user.is_authenticated %}
      <span style="margin-right:15px; font-weight:600;">{{ current_user.ner }}</span>
      <a href="{{ url_for('logout') }}" class="nbtn">Гарах</a>
    {% else %}
      <a href="{{ url_for('login') }}" class="nbtn">Нэвтрэх</a>
    {% endif %}
  </div>
</nav>

<div class="container">
  <div class="hero">
    <h1 class="hh">Мэдлэгээ <span class="gr">Шалгаж</span>,<br>Ирээдүйгээ Цогцлон Бүтээ</h1>

    <div class="ai-search-box">
      <form action="/" method="POST" class="ai-input-row">
        <i class="ti ti-sparkles" style="color:var(--blue2)"></i>
        <input class="ai-input" name="prompt" placeholder="Хичээл эсвэл сэдэв хайх..." required />
        <button type="submit" class="ai-send">↑</button>
      </form>
    </div>

    <div class="grade-row">
      <div class="gc"><span style="color:var(--blue2); font-size:3rem; font-weight:bold;">5</span><br>Дугаар анги</div>
      <div class="gc"><span style="color:var(--green2); font-size:3rem; font-weight:bold;">9</span><br>Дугаар анги</div>
      <div class="gc"><span style="color:var(--purple2); font-size:3rem; font-weight:bold;">12</span><br>Дугаар анги</div>
    </div>
  </div>
</div>

</body>
</html>
