<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superbrain Цогц Систем</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --genspark-primary: #0066fe;
            --genspark-bg: #f4f7fa;
            --card-bg: #ffffff;
            --dark-text: #1e293b;
            --border-color: #e2e8f0;
            --subject-bg: #f8fafc;
        }

        /* Шөнийн (Dark mode) загвар */
        [data-theme="dark"] {
            --genspark-bg: #0f172a;
            --card-bg: #1e293b;
            --dark-text: #f8fafc;
            --border-color: #334155;
            --subject-bg: #111827;
        }

        body {
            background-color: var(--genspark-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--dark-text);
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* --- Bubble Эффект --- */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 102, 254, 0.05);
            animation: float-up 12s infinite linear;
            bottom: -50px;
        }
        [data-theme="dark"] .bubble {
            background: rgba(255, 255, 255, 0.02);
        }
        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }

        /* Навигаци */
        .navbar-genspark {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .brand-logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--genspark-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        /* Өдөр/Шөнө товчлуур */
        .theme-toggle-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--dark-text);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .theme-toggle-btn:hover {
            border-color: var(--genspark-primary);
        }

        /* Hero хэсэг */
        .hero-genspark {
            background-color: var(--card-bg);
            padding: 60px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 40px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* --- AI Хайлтын Цонх (Genspark Style) --- */
        .ai-search-container {
            max-width: 700px;
            margin: 35px auto 10px auto;
            position: relative;
        }
        .ai-search-input {
            width: 100%;
            padding: 18px 25px;
            padding-right: 65px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            background: var(--genspark-bg);
            color: var(--dark-text);
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.3s;
        }
        .ai-search-input:focus {
            outline: none;
            border-color: var(--genspark-primary);
            box-shadow: 0 8px 25px rgba(0, 102, 254, 0.1);
        }
        .ai-search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--genspark-primary);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .ai-search-btn:hover {
            background: #0052cc;
        }

        /* Ангийн картууд */
        .grade-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
        }
        .grade-box:hover {
            border-color: var(--genspark-primary);
            box-shadow: 0 10px 25px rgba(0, 102, 254, 0.08);
            transform: translateY(-2px);
        }
        .grade-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--genspark-primary);
            margin-bottom: 10px;
        }

        /* Хичээлийн жагсаалт */
        .subject-container {
            display: none;
            margin-top: 20px;
            text-align: left;
            background: var(--subject-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }
        .subject-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            color: var(--dark-text);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 6px;
            font-weight: 500;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: all 0.15s ease;
        }
        .subject-item:hover {
            background-color: var(--genspark-primary);
            color: #ffffff;
            border-color: var(--genspark-primary);
        }
        .subject-item i {
            margin-right: 10px;
            color: #94a3b8;
        }
        .subject-item:hover i {
            color: #ffffff;
        }

        /* Онцлог карт */
        .feature-genspark {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            height: 100%;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .feature-icon {
            font-size: 24px;
