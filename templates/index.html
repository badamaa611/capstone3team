<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шалгалтын Бэлтгэл Систем</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#ffffff;--bg2:#f8fafc;--surface:#ffffff;--border:#e2e8f0;--text:#0f172a;--text2:#64748b;--text3:#94a3b8;--blue1:#E6F1FB;--blue2:#378ADD;--blue3:#0C447C;--green1:#E1F5EE;--green2:#1D9E75;--green3:#085041;--purple1:#EEEDFE;--purple2:#7F77DD;--purple3:#3C3489;--shadow:rgba(0,0,0,0.06)}
    .dark{--bg:#080d18;--bg2:#0d1424;--surface:#111827;--border:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--text3:#475569;--blue1:#0c1e35;--blue2:#60a5fa;--blue3:#93c5fd;--green1:#052e20;--green2:#34d399;--green3:#6ee7b7;--purple1:#1a1040;--purple2:#a78bfa;--purple3:#c4b5fd;--shadow:rgba(0,0,0,0.3)}

    body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; transition: background .3s,color .3s; }
    .page{min-height:100vh;position:relative;overflow:hidden;}
    canvas#bb{position:absolute;inset:0;z-index:0;pointer-events:none}
    .ct{position:relative;z-index:1}

    /* NAV */
    .nav{display:flex;justify-content:space-between;align-items:center;padding:13px 24px;border-bottom:.5px solid var(--border);background:rgba(255,255,255,0.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}
    .dark .nav{background:rgba(8,13,24,0.7)}
    .logo-a{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
    .logo-box{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#378ADD,#7F77DD);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(55,138,221,0.3)}
    .logo-name{font-size:14px;font-weight:600;color:var(--text)}
    .logo-tag{font-size:10px;color:var(--text3);display:block;margin-top:-2px}
    .nr{display:flex;gap:6px;align-items:center}
    .nl{font-size:12px;color:var(--text2);padding:5px 10px;border-radius:6px;border:none;background:transparent;cursor:pointer;text-decoration:none;transition:all .15s}
    .nl:hover{background:var(--bg2);color:var(--text)}
    .tbtn{width:38px;height:21px;border-radius:11px;border:.5px solid var(--border);background:var(--bg2);cursor:pointer;position:relative;transition:background .3s;flex-shrink:0;padding:0}
    .tbtn::after{content:'☀️';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .3s}
    .dark .tbtn{background:#1e3a5f}
    .dark .tbtn::after{content:'🌙';left:19px}
    .nbtn{font-size:12px;padding:6px 14px;border-radius:7px;background:linear-gradient(135deg,#378ADD,#7F77DD);color:#fff;border:none;cursor:pointer;font-weight:500;text-decoration:none;transition:all .18s;box-shadow:0 2px 8px rgba(55,138,221,0.25)}
    .nbtn:hover { opacity:.88; transform:translateY(-1px); color: #fff; }

    /* HERO */
    .hero{padding:2.5rem 24px 1.5rem;text-align:center}
    .htag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--blue2);background:var(--blue1);padding:4px 12px;border-radius:99px;margin-bottom:1rem;border:.5px solid rgba(55,138,221,0.2)}
    .hh{font-size:1.75rem;font-weight:600;color:var(--text);line-height:1.25;margin:0 0 .5rem}
    .hh .gr{background:linear-gradient(135deg,var(--blue2),var(--purple2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hs{font-size:13px;color:var(--text2);margin:0 0 1.75rem;max-width:400px;margin-left:auto;margin-right:auto;line-height:1.6}

    /* AI SEARCH BOX */
    .ai-search-wrap{max-width:560px;margin:0 auto 1rem}
    .ai-search-box{background:var(--surface);border:.5px solid var(--border);border-radius:14px;box-shadow:0 4px 24px var(--shadow);overflow:hidden;transition:border-color .2s,box-shadow .2s}
    .ai-search-box:focus-within{border-color:var(--blue2);box-shadow:0 4px 28px rgba(55,138,221,0.15)}
    .ai-input-row{display:flex;align-items:center;gap:10px;padding:12px 14px}
    .ai-icon{color:var(--blue2);font-size:18px;flex-shrink:0}
    .ai-input{flex:1;border:none;background:transparent;font-size:14px;color:var(--text);outline:none;min-width:0}
    .ai-input::placeholder{color:var(--text3)}
    .ai-send{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#378ADD,#7F77DD);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;font-size:14px}
    .ai-send:hover{opacity:.88;transform:scale(1.05)}
    .ai-divider{border:none;border-top:.5px solid var(--border);margin:0 14px}
    .ai-chips-row{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
    .ai-chips-row::-webkit-scrollbar{display:none}
    .chip{font-size:11px;color:var(--text2);background:var(--bg2);border:.5px solid var(--border);border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
    .chip:hover{background:var(--blue1);color:var(--blue2);border-color:rgba(55,138,221,0.3)}
    .ai-hint{font-size:11px;color:var(--text3);text-align:center;margin-bottom:1.75rem}
    .ai-hint span{color:var(--blue2)}

    /* GRADE CARDS */
    .grade-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:440px;margin:0 auto 2rem}
    .gc{border-radius:12px;padding:1.1rem .875rem;cursor:pointer;text-align:center;transition:all .22s;position:relative;overflow:hidden;border:.5px solid transparent}
    .gc:hover{transform:translateY(-4px) scale(1.04)}
    .gc:active{transform:translateY(-1px) scale(1.01)}

    .g5{background:linear-gradient(145deg,var(--blue1),#dbeafe);border-color:#B5D4F4}
    .g9{background:linear-gradient(145deg,var(--green1),#d1fae5);border-color:#9FE1CB}
