<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMART BRAIN - Цогц систем</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    /* Таны өгсөн CSS-ууд энд бүгд байрлана */
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding-top:76px}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;position:fixed;top:0;width:100%;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);z-index:150;}
    /* ... Үлдсэн бүх CSS-ээ энд үргэлжлүүлэн хуулна уу ... */
  </style>
</head>
<body>

<nav class="nav">
  <a class="logo-a" href="/">
    <div class="logo-box">SB</div>
    <div>
      <span class="logo-name">Smart Brain</span>
      <span class="logo-tag">Шалгалтын систем · AI Дэмжлэг</span>
    </div>
  </a>
  <div class="nr">
    <a href="/tests" class="nl">Тестүүд</a>
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('auth.logout') }}" class="nbtn">Гарах</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}" class="nbtn">Нэвтрэх</a>
    {% endif %}
  </div>
</nav>

{% block content %}{% endblock %}

</body>
</html>
