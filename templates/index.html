<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPER BRAIN - Цогц Систем</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue2:#378ADD; --purple2:#7F77DD; --border:#e2e8f0; --text:#0f172a; --surface:#ffffff; }
    body { font-family: -apple-system, sans-serif; padding-top: 76px; background: #f8fafc; }
    
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--border); background: white; position: fixed; top: 0; width: 100%; z-index: 150; }
    .logo-a { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .logo-box { width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--blue2), var(--purple2)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
    .nbtn { padding: 8px 16px; border-radius: 10px; background: var(--blue2); color: #fff; text-decoration: none; font-size: 13px; }
    
    .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; text-align: center; }
    .hh { font-size: 2.5rem; font-weight: 800; margin-bottom: 2rem; }
    
    /* AI Box ба Ангийн картуудын хэсэг */
    .ai-search-wrap { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    
    .grade-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
    .gc { padding: 20px; border: 1px solid var(--border); border-radius: 16px; background: #fdfdfd; }
    .gn { font-size: 2rem; font-weight: 800; color: var(--blue2); }
  </style>
</head>
<body>

<nav class="nav">
  <a class="logo-a" href="/">
    <div class="logo-box">SB</div>
    <div><strong>Super Brain</strong></div>
  </a>
  <div class="nr">
    {% if current_user.is_authenticated %}
      <span>{{ current_user.ner }}</span>
      <a href="{{ url_for('auth.logout') }}" class="nbtn" style="background:#e11d48;">Гарах</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}" class="nbtn">Нэвтрэх</a>
    {% endif %}
  </div>
</nav>

<div class="container">
  <h1 class="hh">Мэдлэгээ <span style="color:var(--blue2)">Шалгаж</span>, Ирээдүйгээ Бүтээ</h1>

  <!-- AI Box -->
  <div class="ai-search-wrap">
    <form method="POST">
      <input type="text" name="prompt" placeholder="AI-аас асуух асуултаа бичнэ үү..." style="width: 80%; padding: 10px; border: 1px solid var(--border); border-radius: 10px;">
      <button type="submit" class="nbtn">Илгээх</button>
    </form>
    
    <!-- Ангийн картууд -->
    <div class="grade-row">
      {% for grade in ['5', '9', '12'] %}
        <div class="gc">
          <div class="gn">{{ grade }}</div>
          <p>-р ангийн тест</p>
          <a href="{{ url_for('take_test', grade=grade) }}" style="display:block; margin-top:10px; color:var(--purple2);">Тест эхлэх</a>
        </div>
      {% endfor %}
    </div>
  </div>
</div>

</body>
</html>
