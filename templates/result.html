{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h2 class="mb-0 fw-bold">🚀 Smart Brain: Шалгалтын үр дүн</h2>
                </div>
                <div class="card-body p-5">
                    <div class="d-flex justify-content-around text-center mb-4">
                        <div>
                            <h6 class="text-muted">Нийт</h6>
                            <p class="fs-2 fw-bold text-primary" id="total-q">0</p>
                        </div>
                        <div>
                            <h6 class="text-muted">Зөв</h6>
                            <p class="fs-2 fw-bold text-success" id="correct-q">0</p>
                        </div>
                        <div>
                            <h6 class="text-muted">Буруу</h6>
                            <p class="fs-2 fw-bold text-danger" id="wrong-q">0</p>
                        </div>
                    </div>

                    <div class="alert alert-info p-4 rounded-3 border-0">
                        <h5 class="fw-bold"><i class="ti ti-robot"></i> Gemini AI Зөвлөмж:</h5>
                        <p id="ai-suggestion" class="mb-0">Системээс зөвлөмж ачаалж байна...</p>
                    </div>
                </div>
                <div class="card-footer bg-light p-4 text-center border-0">
                    <a href="/" class="btn btn-outline-primary btn-lg px-4 rounded-pill">Нүүр хуудас руу буцах</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Backend-ээс ирсэн үр дүнг авах
const result = {{ session.get('test_result') | tojson }};
if (result) {
    document.getElementById('total-q').innerText = result.niit_asuult;
    document.getElementById('correct-q').innerText = result.zow_too;
    document.getElementById('wrong-q').innerText = result.buruu_too;
    document.getElementById('ai-suggestion').innerText = result.ai_recommendation;
}
</script>
