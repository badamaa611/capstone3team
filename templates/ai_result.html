<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Хариулт - Super Brain</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#0f172a;padding-top:100px}
    .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;border-bottom:1px solid rgba(15,23,42,0.08);background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);position:fixed;top:0;left:0;right:0;width:100%;z-index:150;box-shadow:0 10px 30px rgba(15,23,42,0.06)}
    .logo-a{display:flex;align-items:center;gap:10px;text-decoration:none}
    .logo-box{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#378ADD,#7F77DD);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
    .logo-name{font-size:18px;font-weight:800;color:#0f172a;text-transform:uppercase}
    .container{max-width:800px;margin:0 auto;padding:0 24px}
    .result-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;padding:2rem;box-shadow:0 4px 15px rgba(0,0,0,0.04);margin-bottom:2rem}
    .user-q{font-size:1.1rem;font-weight:700;color:#378ADD;margin-bottom:1.5rem;display:flex;align-items:center;gap:8px}
    .ai-ans{font-size:1rem;line-height:1.8;color:#334155;white-space: pre-wrap;}
    .back-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#64748b;font-size:14px;font-weight:600;margin-bottom:1.5rem;transition:color 0.2s}
    .back-btn:hover{color:#378ADD}
  </style>
</head>
<body>

  <nav class="nav">
    <a class="logo-a" href="/">
      <div class="logo-box">SB</div>
      <div><span class="logo-name">Super Brain</span></div>
    </a>
  </nav>

  <div class="container">
    <a href="/" class="back-btn"><i class="ti ti-arrow-left"></i> Нүүр хуудас руу буцах</a>
    
    <div class="result-card">
      <div class="user-q"><i class="ti ti-help-circle"></i> Асуулт: "{{ prompt }}"</div>
      <hr style="border:none; border-top:1px solid #e2e8f0; margin-bottom:1.5rem;">
      <div class="ai-ans">{{ response }}</div>
    </div>
  </div>

</body>
</html>
